<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Component reference · SWUST Apple Keynote</title><link rel="stylesheet" href="core/tokens.css"><style>body{max-width:1100px;margin:auto;padding:60px 30px}h1{font-size:52px;margin:20px 0}h2{font-size:30px;margin:48px 0 24px}p{color:var(--muted);font-size:20px}.code-comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px}.code-comparison h3{font-size:20px;margin:0 0 14px}.code-comparison pre{white-space:pre-wrap;padding:22px;border-radius:16px;line-height:1.6;font-size:18px}.removed{background:#fff0ef;color:#853e39}.added{background:#e9f6ed;color:#256039}.file-explorer{background:white;border:1px solid var(--divider);padding:24px;border-radius:24px;font-size:21px}.file-explorer summary{cursor:pointer;font-weight:600}.file-explorer li{margin:17px 0}.image-placeholder{margin-top:20px}.terminal{margin-top:20px}@media(max-width:700px){.code-comparison{grid-template-columns:1fr}}</style></head><body><span class="eyebrow">REUSABLE COMPONENTS</span><h1>先解释，再操作。</h1><p>与实验台共用同一套组件。文件浏览器可展开，命令可复制，图片缺失保留说明。</p><h2>文件与目录</h2><div id="files"></div><h2>代码对比</h2><div id="diff"></div><h2>Terminal</h2><div id="terminal"></div><h2>素材占位</h2><div class="image-placeholder" id="image" data-alt="用户提供的架构截图"><div class="fallback"><strong>待补充真实架构截图</strong><p>用途：解释模块边界 · 比例 16:9 · 建议 1920×1080</p><code>architecture.png</code></div></div><script src="core/spring.js"></script><script src="core/motion.js"></script><script src="core/settlement.js"></script><script src="core/components.js"></script><script src="core/arrival.js"></script><script>document.querySelector('#files').innerHTML=Keynote.explorer('example-project/',['README.md','src/main.c','build/']);document.querySelector('#diff').innerHTML=Keynote.diff('− puts("Hello");','+ puts("Hello, team");');document.querySelector('#terminal').innerHTML=Keynote.terminal(['git status','git diff --staged'],'查看状态与已暂存差异；此处不执行命令。');Keynote.mountTerminals(document);Keynote.mountImage(document.querySelector('#image'),'');</script></body></html>
